name: Movie Picture Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build \
            -t 992777360646.dkr.ecr.us-east-1.amazonaws.com/backend:${{ github.sha }} \
            ./starter/backend

      - name: Push backend Docker image
        run: |
          docker push \
            992777360646.dkr.ecr.us-east-1.amazonaws.com/backend:${{ github.sha }}

      - name: Build frontend Docker image
        run: |
          docker build \
            -t 992777360646.dkr.ecr.us-east-1.amazonaws.com/frontend:${{ github.sha }} \
            ./starter/frontend

      - name: Push frontend Docker image
        run: |
          docker push \
            992777360646.dkr.ecr.us-east-1.amazonaws.com/frontend:${{ github.sha }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      - name: Deploy backend to EKS
        run: |
          kubectl apply -k ./starter/backend/k8s
          kubectl set image deployment/backend \
            backend=992777360646.dkr.ecr.us-east-1.amazonaws.com/backend:${{ github.sha }}

      - name: Deploy frontend to EKS
        run: |
          kubectl apply -k ./starter/frontend/k8s
          kubectl set image deployment/frontend \
            frontend=992777360646.dkr.ecr.us-east-1.amazonaws.com/frontend:${{ github.sha }}

      - name: Check deployments
        run: |
          kubectl rollout status deployment/backend --timeout=180s
          kubectl rollout status deployment/frontend --timeout=180s